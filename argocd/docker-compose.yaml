services:
  setup:
    image: ubuntu:latest
    container_name: kind-setup
    privileged: true
    volumes:
      - ./kind-config.yaml:/kind-config.yaml
      - ./nginx-configmap.yaml:/nginx-configmap.yaml
      - ./nginx-deployment.yaml:/nginx-deployment.yaml
      - ./nginx-pod.yaml:/nginx-pod.yaml
      - ./nginx-service.yaml:/nginx-service.yaml
    command: >
      bash -c "
      apt-get update && 
      apt-get install -y curl apt-transport-https && 
      curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64 && 
      chmod +x ./kind && mv ./kind /usr/local/bin/kind && 
      curl -LO \"https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl\" && 
      chmod +x kubectl && mv kubectl /usr/local/bin/ && 
      kind create cluster --config /kind-config.yaml && 
      kubectl apply -f /nginx-configmap.yaml && 
      kubectl apply -f /nginx-deployment.yaml && 
      kubectl apply -f /nginx-pod.yaml && 
      kubectl apply -f /nginx-service.yaml && 
      tail -f /dev/null"

  argocd:
    image: argoproj/argocd:latest
    container_name: argocd-server
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ~/.kube:/root/.kube # Montar o kubeconfig para acesso ao cluster
    environment:
      - ARGOCD_ADMIN_PASSWORD=admin123
    command: >
      bash -c "
      argocd-server --insecure & 
      sleep 30 && 
      argocd login localhost:9000 --username admin --password $ARGOCD_ADMIN_PASSWORD && 
      argocd cluster add kind-kind --insecure --in-cluster --upsert && 
      argocd app create kube-argo \
        --repo https://github.com/Monitoring-Cycle/infra-observability.git \
        --path . \
        --dest-server https://kubernetes.default.svc \
        --dest-namespace default && 
      argocd app sync kube-argo && 
      tail -f /dev/null"
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - observability

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config/loki-config.yaml:/etc/loki/local-config.yaml
      - ./loki-data:/var/lib/loki
      - ./loki-data/wal:/wal
    user: "10001:10001"
    networks:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./opentelemetry/config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command: ["--config=/etc/otel-collector-config.yaml"]
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/config/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/config/dashboards.json:/etc/grafana/provisioning/dashboards/dashboards.json
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost:3000
    networks:
      - observability

  letsencrypt:
    container_name: letsencrypt
    image: linuxserver/swag
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - URL=localhost
      - SUBDOMAINS=wildcard
      - VALIDATION=dns
      - DNSPLUGIN=cloudflare
      - EMAIL=email@seudomínio.com.br
      - DHLEVEL=4096
    volumes:
      - ./letsencrypt:/config
    networks:
      - observability

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d/sites-available:/etc/nginx/sites-available
      - ./nginx/conf.d/sites-enabled:/etc/nginx/sites-enabled
      - ./letsencrypt:/etc/letsencrypt
    depends_on:
      - letsencrypt
      - grafana
      - prometheus
    networks:
      - observability

networks:
  observability:
    driver: bridge
